<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1e140c">
  <title>BarberSerwis — offline</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #2b1d12;
      color: #fff;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .box {
      max-width: 520px;
      background: #18181d;
      border: 1px solid rgba(224,179,106,.35);
      border-radius: 18px;
      padding: 28px;
      text-align: center;
    }

    h1 {
      color: #e0b36a;
      margin-top: 0;
    }

    p {
      color: #d2c6b6;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>BarberSerwis</h1>
    <p>
      Brak połączenia z internetem. Po odzyskaniu sieci odśwież stronę,
      aby pobrać aktualne dane zleceń.
    </p>
  </div>
</body>
</html>
